name: python_tests
on:
  push:
    branches: [master]
  # No `paths-ignore:` filter here: python_tests is a required status check on master,
  # and a workflow skipped by a trigger filter never reports, leaving the PR unmergeable.
  pull_request:
    branches: [master]
permissions:
  contents: read

jobs:
  python_tests:
    # Pinned: ubuntu-latest is now 26.04, and actions/setup-python has no Python 3.14.5
    # build for 26.04 (builds start at 3.14.6). Go back to ubuntu-latest once
    # pyproject.toml and docker/Dockerfile.olbase move to 3.14.6 or later.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      # Python is GitHub's build (actions/python-versions), via setup-python. Without a copy in the
      # runner's tool cache, setup-python downloads it and upgrades its pip, which takes about 10s,
      # so the tool cache's copy is saved with actions/cache.
      - name: Read the Python version
        id: python
        run: echo "version=$(sed -nE 's/^requires-python = ">=([0-9.]+),.*/\1/p' pyproject.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/Python/${{ steps.python.outputs.version }}
          key: python-${{ steps.python.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: pyproject.toml
      # The uv cache is pruned to what is slow to rebuild (psycopg2, built from source, and the git
      # dependencies). PyPI wheels download faster than a cache of them restores.
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: requirements*.txt
        env:
          UV_PYTHON_DOWNLOADS: never # build the venv from setup-python's Python
      - name: Install dependencies
        run: |
          python -c "import sys; print(sys.version, sys.base_prefix)"
          uv pip install -r requirements_test.txt
      - run: make git
      - name: Run make i18n
        run: |
          make i18n
          make test-i18n
      - name: Run tests
        run: |
          git fetch --no-tags --prune --depth=1 origin master
          # The integration tests spend most of their time on a PostgreSQL server, so they run
          # alongside the unit tests on the vCPUs the xdist workers leave idle.
          # ubuntu-24.04 has PostgreSQL pre-installed; pytest-postgresql finds pg_ctl via pg_config.
          timeout 300 pytest -m integration openlibrary/tests/core/ > integration.log 2>&1 &
          integration_pid=$!
          # pytest-xdist with one worker per physical core: 2 on this 4-vCPU runner. Measured
          # slower with 4 (-n logical): the hyperthreads add little, and every worker repeats collection.
          unit_status=0
          make test-py PYTEST_ARGS=". --doctest-modules -n auto" || unit_status=$?
          integration_status=0
          wait $integration_pid || integration_status=$?
          echo "::group::Integration tests (exit $integration_status)"
          cat integration.log
          echo "::endgroup::"
          [ "$integration_status" -eq 0 ] || echo "::error::Integration tests failed (exit $integration_status); see the 'Integration tests' group above"
          [ "$unit_status" -eq 0 ] && [ "$integration_status" -eq 0 ]

  # Runs the i18n checks against the .po files olbase will bake from openlibrary-i18n
  # (via the same script docker/Dockerfile.olbase runs), not the ones committed here.
  i18n_upstream:
    runs-on: ubuntu-24.04 # Pinned for Python 3.14.5; see python_tests above.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: pyproject.toml
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.pythonLocation }}
          key: ${{ runner.os }}-venv-${{ env.pythonLocation }}-${{ hashFiles('requirements*.txt') }}
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install dependencies
        env:
          UV_SYSTEM_PYTHON: 1
        run: uv pip install -r requirements_test.txt
      - run: make git
      - name: Pull translations from openlibrary-i18n
        run: |
          status=0
          ./scripts/i18n-pull-translations.sh main --strict || status=$?
          { echo '### openlibrary-i18n translations'; echo '```'; cat openlibrary/i18n/openlibrary-i18n.txt || echo 'pull failed before writing the manifest'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Run i18n checks on the pulled translations
        run: |
          make i18n
          make test-i18n
          pytest openlibrary/i18n/test_po_files.py
